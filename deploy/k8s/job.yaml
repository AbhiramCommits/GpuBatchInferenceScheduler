---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: benchmark-results
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-benchmark
  labels:
    app: gpu-benchmark
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: gpu-benchmark
    spec:
      restartPolicy: Never
      nodeSelector:
        nvidia.com/gpu.present: "true"
      containers:
        - name: benchmark
          image: gpuinfer/scheduler:latest
          imagePullPolicy: IfNotPresent
          # Same workload as deploy/slurm/submit.sbatch: batched GEMM
          # C[b] = A[b] * B[b] with M=N=K=1024, batch 8, float32.
          command:
            - sh
            - -c
            - bench_gemm --m 1024 --n 1024 --k 1024 --batch 8 --iters 10 --impl cublas | tee /results/benchmark.csv
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
              nvidia.com/gpu: "1"
            limits:
              memory: "4Gi"
              cpu: "2"
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: results
              mountPath: /results
      volumes:
        - name: results
          persistentVolumeClaim:
            claimName: benchmark-results
