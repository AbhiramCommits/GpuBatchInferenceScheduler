apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpu-scheduler
  labels:
    app: gpu-scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpu-scheduler
  template:
    metadata:
      labels:
        app: gpu-scheduler
    spec:
      nodeSelector:
        nvidia.com/gpu.present: "true"
      containers:
        - name: scheduler
          image: gpuinfer/scheduler:latest
          imagePullPolicy: IfNotPresent
          args:
            - --jobs
            - "$(JOBS)"
            - --arrival-rate
            - "$(ARRIVAL_RATE)"
            - --workers
            - "$(WORKERS)"
            - --max-batch
            - "$(MAX_BATCH)"
            - --impl
            - "$(IMPL)"
            - --margin-mb
            - "$(MARGIN_MB)"
            - --http-port
            - "$(HTTP_PORT)"
          envFrom:
            - configMapRef:
                name: scheduler-config
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
              nvidia.com/gpu: "1"
            limits:
              memory: "2Gi"
              cpu: "2"
              nvidia.com/gpu: "1"
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: scheduler-config
              mountPath: /etc/scheduler
              readOnly: true
      volumes:
        - name: scheduler-config
          configMap:
            name: scheduler-config
